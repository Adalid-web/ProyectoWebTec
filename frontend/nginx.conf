# Nginx sirve los HTML/CSS/JS. API, login, callbacks y logout
# comparten el mismo origen HTTPS para enviar la cookie correctamente.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # No almacenar respuestas de sesion ni reportes en la cache del navegador.
    location ~ ^/(api(?:/|$)|login(?:/|$)|signin-[^/]+|logout$|swagger(?:/|$)|health(?:/|$)) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    # Serve actual legal pages, not the SPA fallback.
    location = /terms { try_files /terms.html =404; }
    location = /privacy { try_files /privacy.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
